name = "atelier-monitor"
main = "src/index.js"
compatibility_date = "2026-08-01"

# One trigger, every minute. The per-tier intervals (1 / 5 / 15 minutes) are
# decided in src/targets.js from the minute of the hour, rather than by three
# cron expressions, so that adding a tier is a data change instead of a
# deployment-config change — and so the free plan's cron-trigger allowance is
# not something to think about.
#
# Cron triggers are an ACCOUNT-level Workers feature and work on the free
# Workers plan. The bwa zone's Business plan confers nothing here; do not
# assume it does.
[triggers]
crons = ["* * * * *"]

# Between-tick memory. See src/state.js for why this is written so rarely:
# Workers KV on the free plan allows 1,000 writes a day and this Worker wakes
# 1,440 times, so the state is deliberately shaped to change only on
# transitions.
#
# Create it once, then paste the id here:
#   npx wrangler kv namespace create STATE
[[kv_namespaces]]
binding = "STATE"
id = "fcae39d0bd5a457096d22038050c698a"

# Lets the Worker send email itself, independent of GitHub's notifications.
#
# No `destination_address` on purpose. Pinning one here would publish the
# recipient — this repository is public — so the address arrives as a secret
# instead. That is not a hole: Cloudflare only ever delivers to addresses
# already verified as Email Routing destinations on this account, so an
# unrestricted binding still cannot be used as an open relay.
#
# Deliberately on atelierbooking.co, NOT bookwithatelier.com. Three reasons,
# and the first is the one that would have caused an incident:
#
#  1. Enabling Cloudflare Email Routing REPLACES a zone's MX records.
#     bookwithatelier.com carries live iCloud MX and receives real mail, so
#     turning it on there would have broken inbound mail to the domain.
#     atelierbooking.co has no MX and no SPF — nothing to break.
#  2. SPF isolation. bookwithatelier.com's SPF is tuned for the platform's
#     outbound mail; adding a sender to it risks the ten-lookup limit, and an
#     SPF permerror there would break TENANT email, not just alerts. A
#     monitoring feature must not be able to do that.
#  3. Reputation isolation. The platform's domain sends tenant notifications
#     in volume. A complaint spike or a provider suspension against that
#     domain must not also silence the alert that tells you about it.
#
# Both zones are on the same Cloudflare account, so this isolates DNS churn
# and mail reputation — not a Cloudflare account or provider failure. That
# case is covered by Upptime, which runs on GitHub.
#
# Requires Email Routing enabled on the atelierbooking.co zone, with the
# recipient verified under Email → Email Routing → Destination addresses.
[[send_email]]
name = "ALERT_EMAIL"

[vars]
# Sender. A role address on the isolated zone; see the note above.
ALERT_EMAIL_FROM = "alerts@atelierbooking.co"

# The private repo that receives outage issues. NOT this repository: an alert
# names the site, and most of the monitored sites are prospect pitch sites for
# businesses that have not agreed to anything.
ALERT_ISSUE_REPO = "bookwithatelier/atelier"

# ---------------------------------------------------------------------------
# Secrets — set with `npx wrangler secret put <NAME>`, never in this file.
# This repository is public.
#
#   PRIVATE_TARGETS     JSON array of the unlisted targets. Generate it with
#                       scripts/sync-private-targets.sh, which reads them from
#                       the production box and pipes them straight in.
#   MONITOR_TOKEN       Shared value sent as X-Atelier-Monitor, matched by a
#                       Cloudflare WAF skip rule so these checks are not bot-
#                       challenged. Not authentication — /health.php is
#                       unauthenticated by design and discloses nothing.
#   TWILIO_ACCOUNT_SID  Twilio REST credentials, used directly. Deliberately
#   TWILIO_AUTH_TOKEN   not the platform's SMS gateway: that runs on the box
#   TWILIO_FROM         this Worker is watching. TWILIO_FROM must be the BWA
#                       platform number once it exists — never a tenant's
#                       customer-facing bot number, which is registered to
#                       that tenant's A2P campaign and shares a failure
#                       domain with the system being watched.
#   ALERT_SMS_TO        Platform operations' mobile. NOT the shop line, and
#                       never a tenant's number. DORMANT until the BWA number
#                       clears A2P registration.
#   ALERT_EMAIL_TO      Where alerts land. A secret rather than a var so a
#                       public repo does not publish the address; must be a
#                       verified Cloudflare Email Routing destination.
#   GITHUB_PAT          Fine-grained PAT with Issues: read/write on
#                       ALERT_ISSUE_REPO. Nothing else.
#   DASHBOARD_TOKEN     Bearer token for the debug endpoint, which exposes the
#                       private target list and is 404 without it.
# ---------------------------------------------------------------------------

[observability]
enabled = true
