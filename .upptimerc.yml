# Upptime configuration — the public half of Atelier's outage detection.
#
# READ THIS BEFORE ADDING A SITE
# ------------------------------
# This repository is PUBLIC (GitHub Pages on the free tier requires it), which
# means every URL in this file is crawlable, diffable through git history, and
# listed by name on the status page.
#
# Almost all of those ~32 sites are per-customer builds on hostnames that
# identify the customer. A hostname here is published to anyone who loads the
# status page, and for most of these that would be the first the business
# heard of it. Publishing the list would be a disclosure, not a status page.
#
# So NO customer site is named here at all — not tenants, not previews. They
# are reported by CATEGORY through the `?scope=` aggregate, which answers
# 200/503 for a whole group and returns counts rather than hostnames. Only the
# platform's own surfaces are named, because they are ours.
#
# Per-site detail — which tenant, which preview site, what broke — lives in
# Cloudflare Worker in worker/, which is private, and in the outage issues it
# files in the private repo.
#
# Adding a URL here is a publication decision. Make it deliberately.

owner: bookwithatelier
repo: status

# Identifies the checker in origin logs, and — more importantly — is what a
# Cloudflare WAF skip rule can match on. See "Cloudflare" in README.md: a
# monitor that gets bot-challenged reports a healthy site as down, and false
# alarms are how a monitor gets ignored.
user-agent: "Atelier-Upptime/1.0 (+https://github.com/bookwithatelier/status)"

# Authoritative secret allowlist. Only these are exposed to the workflows.
# MONITOR_TOKEN is a shared value the Cloudflare WAF rule matches so these
# checks skip bot management; it is NOT authentication — /health.php is
# unauthenticated by design and reveals nothing.
secrets:
  - MONITOR_TOKEN

sites:
  # Every entry points at /health.php rather than at /, deliberately.
  #
  # These sites sit behind Cloudflare, and a cached edge response for / would
  # keep this page green while the origin is dead — the exact way a status
  # page lies. /health.php answers `no-store`, so it always reaches the
  # origin, and it returns 503 only when the site genuinely cannot serve.
  # It is the more truthful signal, at the cost of a less pretty URL.

  # --- Platform surfaces: ours, so they are named. -------------------------
  - name: Book With Atelier
    url: https://bookwithatelier.com/health.php
    headers:
      - "X-Atelier-Monitor: $MONITOR_TOKEN"
    maxResponseTime: 5000
    maxRetries: 2

  - name: Atelier Studio
    url: https://studio.bookwithatelier.com/health.php
    headers:
      - "X-Atelier-Monitor: $MONITOR_TOKEN"
    maxResponseTime: 5000
    maxRetries: 2

  # --- Customer sites: reported by CATEGORY, never by name. ----------------
  #
  # `?scope=` aggregates every site in a category into one 200/503 and a body
  # of counts and reason strings — no hostname, no site directory, nothing a
  # reader could diff back into a membership list. Membership is declared on
  # the production box in env/_monitor-scopes.txt and never leaves it.
  #
  # One member down turns the whole category red. That is correct and it is
  # the case that matters: the 2026-08-28 outage hit exactly one site out of
  # thirty-two, and a category that only went red when every member did would
  # have stayed green through all four and a half hours of it.
  #
  # Both are served by bookwithatelier.com — every site on this platform runs
  # on the same box, so an aggregate served from any of them is a statement
  # about that box. The trade-off to know: if bwa's own vhost breaks while the
  # rest are fine, these two rows go red with it. The row above tells you that
  # is what happened.
  - name: Tenant sites
    url: https://bookwithatelier.com/health.php?scope=tenant
    headers:
      - "X-Atelier-Monitor: $MONITOR_TOKEN"
    maxResponseTime: 15000
    maxRetries: 2

  # The category was called "prospect" until 2026-09-12, in the row name AND
  # in the ?scope= parameter below — a word describing our commercial intent
  # toward the site's owner, in a URL on a page that owner is invited to read.
  #
  # The URL below is the LAST thing to flip. health.php resolves the scope,
  # it lives in the private atelier repo, and it deploys separately from this
  # file: asking for ?scope=preview before that deploy lands gets a 400 and
  # reddens the public category row. The endpoint now accepts both spellings
  # (ScopeRegistry::PROSPECT_LEGACY), so once it is deployed this becomes a
  # one-word edit with no window.
  - name: Preview sites
    url: https://bookwithatelier.com/health.php?scope=prospect
    headers:
      - "X-Atelier-Monitor: $MONITOR_TOKEN"
    maxResponseTime: 20000
    maxRetries: 2

# Who gets the GitHub issue — which is what actually delivers the alert, via
# GitHub's own notification email, on infrastructure that has nothing to do
# with ours.
assignees:
  - nalipaz

status-website:
  name: Atelier Status
  cname: status.bookwithatelier.com
  # ABSOLUTE, and it has to stay that way. A relative "/logo-mark.svg" is
  # treated by sapper's export crawler as an internal route, so it writes
  # export/logo-mark.svg as a DIRECTORY — which then collides with the
  # assets/ copy and kills the build with
  #   cp: could not write to dest file (code=EISDIR)
  # reported only as a check annotation, never in the job log.
  #
  # raw.githubusercontent rather than our own domain, so the favicon does not
  # depend on the Pages certificate being issued.
  #
  # HEAD, not a branch name. Measured after the main -> master rename:
  # raw.githubusercontent DOES follow GitHub's rename redirect, so the old
  # /main/ path still answers 200. That redirect is undocumented behaviour
  # that disappears the day someone recreates a branch by the old name, and
  # it is not something a favicon should quietly depend on. HEAD resolves to
  # whatever the default branch is called, unconditionally — which is what
  # the README's own badge URLs already do.
  logoUrl: https://raw.githubusercontent.com/bookwithatelier/status/HEAD/assets/logo-mark.svg
  introTitle: "Live and historical status for the Atelier booking platform."
  introMessage: >
    Checks run from GitHub's infrastructure every five minutes, independently
    of the servers they are watching, and hit each origin directly rather than
    the CDN edge — so a cached page cannot make an outage look like uptime.
    Customer sites are reported as a group; individual businesses are not
    named here.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

  # The "Services we depend on" strip. Rendered by the script below from the
  # Worker's public /vendors.json (worker/src/index.js, vendorsResponse) —
  # the same snapshot the Worker already stores for alert context, nothing
  # more. It is appended to the end of <main> after the page has hydrated,
  # so the platform's own rows always come first and a vendor's bad day
  # never pushes them down.
  #
  # Why not Upptime rows pointing at the vendor status feeds: Upptime reports
  # up/down by HTTP status, and a Statuspage feed answers 200 during a major
  # incident. The Worker reads the body and normalises it; this just shows
  # the result.
  #
  # Failure mode is silence: if the Worker is unreachable or the JSON is not
  # what is expected, nothing is rendered. A half-broken strip on a status
  # page is worse than none.
  #
  # ONE VALUE TO SET: data-src below must be the Worker's public hostname —
  # https://atelier-monitor.<subdomain>.workers.dev/vendors.json, where
  # <subdomain> is the account's workers.dev subdomain (`npx wrangler whoami`
  # or the Workers dashboard). It is not committed anywhere else.
  customBodyHtml: |
    <style>
      .atelier-vendors { margin-top: 2.5rem; }
      .atelier-vendors h2 { font-size: 1.25em; margin-bottom: 0.25em; }
      .atelier-vendors .atelier-vendors__lead { margin: 0 0 1rem 0; opacity: 0.85; font-size: 0.95em; }
      .atelier-vendors ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
      .atelier-vendors li { padding: 0.75rem 1rem; border-radius: 0.2rem; border: 1px solid var(--card-border-color); border-left-width: 4px; background: var(--card-background-color); display: flex; flex-direction: column; gap: 0.15rem; }
      .atelier-vendors li.is-up { border-left-color: var(--up-border-left-color); }
      .atelier-vendors li.is-degraded { border-left-color: var(--degraded-border-left-color); }
      .atelier-vendors li.is-down { border-left-color: var(--down-border-left-color); }
      .atelier-vendors li.is-unknown { border-left-color: var(--card-border-color); }
      .atelier-vendors .atelier-vendors__head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
      .atelier-vendors .atelier-vendors__name { font-weight: 500; }
      .atelier-vendors .atelier-vendors__tag { font-size: 0.75em; padding: 0.1em 0.5em; border-radius: 0.2rem; white-space: nowrap; color: var(--tag-color); background: var(--card-border-color); }
      .atelier-vendors li.is-up .atelier-vendors__tag { background: var(--tag-up-background-color); }
      .atelier-vendors li.is-degraded .atelier-vendors__tag { background: var(--tag-degraded-background-color); }
      .atelier-vendors li.is-down .atelier-vendors__tag { background: var(--tag-down-background-color); }
      .atelier-vendors li.is-unknown .atelier-vendors__tag { color: var(--body-text-color); }
      .atelier-vendors .atelier-vendors__role { font-size: 0.85em; opacity: 0.8; }
      .atelier-vendors .atelier-vendors__desc { font-size: 0.85em; }
      .atelier-vendors .atelier-vendors__foot { margin: 0.75rem 0 0 0; font-size: 0.8em; opacity: 0.7; }
    </style>
    <script data-src="https://atelier-monitor.REPLACE-ME.workers.dev/vendors.json">
      (function () {
        var src = document.currentScript && document.currentScript.getAttribute('data-src');
        if (!src || src.indexOf('REPLACE-ME') !== -1) return;
        var LABEL = { none: 'Operational', minor: 'Degraded', major: 'Partial outage', critical: 'Major outage', unknown: 'No data' };
        var CLASS = { none: 'is-up', minor: 'is-degraded', major: 'is-down', critical: 'is-down' };
        function el(tag, cls, text) {
          var node = document.createElement(tag);
          if (cls) node.className = cls;
          if (text) node.textContent = text;
          return node;
        }
        function ago(iso) {
          var ms = Date.now() - new Date(iso).getTime();
          if (!(ms >= 0)) return '';
          var m = Math.round(ms / 60000);
          if (m < 2) return 'just now';
          if (m < 60) return m + ' minutes ago';
          var h = Math.round(m / 60);
          if (h < 48) return h + (h === 1 ? ' hour ago' : ' hours ago');
          return Math.round(h / 24) + ' days ago';
        }
        function render(data) {
          if (!data || !Array.isArray(data.vendors) || !data.vendors.length) return;
          var section = el('section', 'atelier-vendors');
          section.appendChild(el('h2', null, 'Services we depend on'));
          section.appendChild(el('p', 'atelier-vendors__lead',
            'What each provider reports on its own status page, checked every five minutes. ' +
            'This is context for the rows above, not a verdict on them: a provider can say all is well while one account is broken, and the rows above are what we actually measure.'));
          var list = el('ul');
          data.vendors.forEach(function (v) {
            var ind = LABEL.hasOwnProperty(v.indicator) ? v.indicator : 'unknown';
            var item = el('li', CLASS[ind] || 'is-unknown');
            var head = el('div', 'atelier-vendors__head');
            head.appendChild(el('span', 'atelier-vendors__name', v.name || v.id));
            head.appendChild(el('span', 'atelier-vendors__tag', LABEL[ind]));
            item.appendChild(head);
            if (v.role) item.appendChild(el('span', 'atelier-vendors__role', v.role));
            if (ind !== 'none' && ind !== 'unknown' && v.description) item.appendChild(el('span', 'atelier-vendors__desc', v.description));
            list.appendChild(item);
          });
          section.appendChild(list);
          var when = data.as_of ? ago(data.as_of) : '';
          if (when) section.appendChild(el('p', 'atelier-vendors__foot', 'Last change ' + when + '.'));
          var main = document.querySelector('main.container') || document.querySelector('main');
          if (main) main.appendChild(section);
          else document.body.appendChild(section);
        }
        function go() {
          // After load, and a beat later: Sapper hydrates <main> on load and
          // drops nodes it did not render, so the strip waits until that is done.
          setTimeout(function () {
            fetch(src, { cache: 'default' })
              .then(function (r) { return r.ok ? r.json() : null; })
              .then(render)
              .catch(function (e) { if (window.console) console.warn('vendor strip:', e); });
          }, 600);
        }
        if (document.readyState === 'complete') go();
        else window.addEventListener('load', go);
      })();
    </script>

# GitHub `schedule:` is best-effort and queues under load — five minutes is
# the nominal interval and 15 is a routine one. That latency is accepted here
# and covered by the Cloudflare Worker, which checks every minute. The two
# run on different clouds on purpose: this one keeps working when Cloudflare
# is the thing that is broken, and the Worker keeps working when GitHub is.
workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updates: "0 3 * * *"
  updateTemplate: "0 0 * * 0"

commitMessages:
  commitAuthorName: Atelier Status Bot
  commitAuthorEmail: nicholas@alipaz.net
