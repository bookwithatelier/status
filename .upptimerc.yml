# Upptime configuration — the public half of Atelier's outage detection.
#
# READ THIS BEFORE ADDING A SITE
# ------------------------------
# This repository is PUBLIC (GitHub Pages on the free tier requires it), which
# means every URL in this file is crawlable, diffable through git history, and
# listed by name on the status page.
#
# Atelier runs ~32 sites but has exactly ONE real tenant. The rest are
# unsolicited prospect pitch sites, built for businesses that have not agreed
# to anything and in most cases do not know the site exists. Publishing that
# list would be a disclosure, not a status page.
#
# So NO customer site is named here at all — not tenants, not prospects. They
# are reported by CATEGORY through the `?scope=` aggregate, which answers
# 200/503 for a whole group and returns counts rather than hostnames. Only the
# platform's own surfaces are named, because they are ours.
#
# Per-site detail — which tenant, which prospect, what broke — lives in the
# Cloudflare Worker in worker/, which is private, and in the outage issues it
# files in the private repo.
#
# Adding a URL here is a publication decision. Make it deliberately.

owner: bookwithatelier
repo: status

# Identifies the checker in origin logs, and — more importantly — is what a
# Cloudflare WAF skip rule can match on. See "Cloudflare" in README.md: a
# monitor that gets bot-challenged reports a healthy site as down, and false
# alarms are how a monitor gets ignored.
user-agent: "Atelier-Upptime/1.0 (+https://github.com/bookwithatelier/status)"

# Authoritative secret allowlist. Only these are exposed to the workflows.
# MONITOR_TOKEN is a shared value the Cloudflare WAF rule matches so these
# checks skip bot management; it is NOT authentication — /health.php is
# unauthenticated by design and reveals nothing.
secrets:
  - MONITOR_TOKEN

sites:
  # Every entry points at /health.php rather than at /, deliberately.
  #
  # These sites sit behind Cloudflare, and a cached edge response for / would
  # keep this page green while the origin is dead — the exact way a status
  # page lies. /health.php answers `no-store`, so it always reaches the
  # origin, and it returns 503 only when the site genuinely cannot serve.
  # It is the more truthful signal, at the cost of a less pretty URL.

  # --- Platform surfaces: ours, so they are named. -------------------------
  - name: Book With Atelier
    url: https://bookwithatelier.com/health.php
    headers:
      - "X-Atelier-Monitor: $MONITOR_TOKEN"
    maxResponseTime: 5000
    maxRetries: 2

  - name: Atelier Studio
    url: https://studio.bookwithatelier.com/health.php
    headers:
      - "X-Atelier-Monitor: $MONITOR_TOKEN"
    maxResponseTime: 5000
    maxRetries: 2

  # --- Customer sites: reported by CATEGORY, never by name. ----------------
  #
  # `?scope=` aggregates every site in a category into one 200/503 and a body
  # of counts and reason strings — no hostname, no site directory, nothing a
  # reader could diff back into a membership list. Membership is declared on
  # the production box in env/_monitor-scopes.txt and never leaves it.
  #
  # One member down turns the whole category red. That is correct and it is
  # the case that matters: the 2026-08-28 outage hit exactly one site out of
  # thirty-two, and a category that only went red when every member did would
  # have stayed green through all four and a half hours of it.
  #
  # Both are served by bookwithatelier.com — every site on this platform runs
  # on the same box, so an aggregate served from any of them is a statement
  # about that box. The trade-off to know: if bwa's own vhost breaks while the
  # rest are fine, these two rows go red with it. The row above tells you that
  # is what happened.
  - name: Tenant sites
    url: https://bookwithatelier.com/health.php?scope=tenant
    headers:
      - "X-Atelier-Monitor: $MONITOR_TOKEN"
    maxResponseTime: 15000
    maxRetries: 2

  - name: Prospect sites
    url: https://bookwithatelier.com/health.php?scope=prospect
    headers:
      - "X-Atelier-Monitor: $MONITOR_TOKEN"
    maxResponseTime: 20000
    maxRetries: 2

# Who gets the GitHub issue — which is what actually delivers the alert, via
# GitHub's own notification email, on infrastructure that has nothing to do
# with ours.
assignees:
  - nalipaz

status-website:
  name: Atelier Status
  cname: status.bookwithatelier.com
  # ABSOLUTE, and it has to stay that way. A relative "/logo-mark.svg" is
  # treated by sapper's export crawler as an internal route, so it writes
  # export/logo-mark.svg as a DIRECTORY — which then collides with the
  # assets/ copy and kills the build with
  #   cp: could not write to dest file (code=EISDIR)
  # reported only as a check annotation, never in the job log.
  #
  # raw.githubusercontent rather than our own domain, so the favicon does not
  # depend on the Pages certificate being issued.
  logoUrl: https://raw.githubusercontent.com/bookwithatelier/status/main/assets/logo-mark.svg
  introTitle: "Live and historical status for the Atelier booking platform."
  introMessage: >
    Checks run from GitHub's infrastructure every five minutes, independently
    of the servers they are watching, and hit each origin directly rather than
    the CDN edge — so a cached page cannot make an outage look like uptime.
    Customer sites are reported as a group; individual businesses are not
    named here.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# GitHub `schedule:` is best-effort and queues under load — five minutes is
# the nominal interval and 15 is a routine one. That latency is accepted here
# and covered by the Cloudflare Worker, which checks every minute. The two
# run on different clouds on purpose: this one keeps working when Cloudflare
# is the thing that is broken, and the Worker keeps working when GitHub is.
workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updates: "0 3 * * *"
  updateTemplate: "0 0 * * 0"

commitMessages:
  commitAuthorName: Atelier Status Bot
  commitAuthorEmail: nicholas@alipaz.net
