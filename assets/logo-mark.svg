<svg xmlns="http://www.w3.org/2000/svg" viewBox="84 4 112 120" fill="none" role="img" aria-label="Atelier">
  <!--
    Atelier A-mark only (no wordmark) — light surfaces.
    Same geometry as logo.svg: apex (140,10), feet (90,118)/(190,118),
    gold slot bar at y=62 with ticks. Cropped to the glyph.
  -->
  <line x1="140" y1="10" x2="90"  y2="118" stroke="#14193a" stroke-width="8.5" stroke-linecap="round"/>
  <line x1="140" y1="10" x2="190" y2="118" stroke="#14193a" stroke-width="8.5" stroke-linecap="round"/>
  <line x1="100" y1="62" x2="180" y2="62"  stroke="#b5873a" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="100" y1="52" x2="100" y2="62"  stroke="#b5873a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="180" y1="52" x2="180" y2="62"  stroke="#b5873a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
